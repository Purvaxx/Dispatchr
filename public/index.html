<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Nearest Driver — Real-Time Dispatch Demo</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16212c;
    --accent: #38bdf8;
    --available: #22c55e;
    --busy: #f97316;
    --rider: #eab308;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .layout { display: flex; gap: 20px; align-items: flex-start; }
  canvas {
    background: var(--panel);
    border-radius: 10px;
    border: 1px solid #223042;
    cursor: crosshair;
  }
  .panel {
    background: var(--panel);
    border: 1px solid #223042;
    border-radius: 10px;
    padding: 16px;
    width: 240px;
    font-size: 13px;
  }
  .panel h3 { margin: 0 0 10px; font-size: 14px; color: var(--accent); }
  .stat { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--muted); }
  .stat b { color: var(--text); }
  .legend { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #log { margin-top: 10px; max-height: 160px; overflow-y: auto; font-size: 12px; color: var(--muted); line-height: 1.5; }
  #log div { border-bottom: 1px solid #1f2b38; padding: 4px 0; }
</style>
</head>
<body>
  <h1>Nearest Driver — Real-Time Dispatch</h1>
  <p class="sub">Click anywhere on the map to request a ride. The nearest available driver is matched instantly via a quadtree spatial index.</p>

  <div class="layout">
    <canvas id="map" width="640" height="640"></canvas>

    <div class="panel">
      <h3>Fleet Status</h3>
      <div class="stat">Total drivers <b id="total">0</b></div>
      <div class="stat">Available <b id="available">0</b></div>
      <div class="stat">Busy (on trip) <b id="busy">0</b></div>

      <div class="legend"><span class="dot" style="background:var(--available)"></span> Available driver</div>
      <div class="legend"><span class="dot" style="background:var(--busy)"></span> Busy driver</div>
      <div class="legend"><span class="dot" style="background:var(--rider)"></span> Rider request</div>

      <h3 style="margin-top:16px;">Match Log</h3>
      <div id="log"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
